[project]
name = "terraform-usecases"
version = "0.1.0"
description = "A collection of terraform use cases"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Hassan Abedi", email = "hassan.abedi.t@gmail.com" }
]
requires-python = ">=3.14,<4.0"
